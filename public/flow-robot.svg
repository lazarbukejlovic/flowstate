<svg width="280" height="320" viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="head" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F2EEFF" />
      <stop offset="100%" stop-color="#C9C0E5" />
    </radialGradient>
    <radialGradient id="shoulder" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAB0D8" />
    </radialGradient>
    <radialGradient id="visor" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E1438" />
      <stop offset="100%" stop-color="#08031A" />
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF8FF" />
      <stop offset="35%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#7C3AED" />
    </radialGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>
  <!-- Body -->
  <path d="M 18 188 Q 16 174 30 172 L 170 172 Q 184 174 182 188 L 182 215 Q 182 228 170 228 L 30 228 Q 18 228 18 215 Z" fill="url(#shoulder)" stroke="rgba(124,58,237,0.28)" stroke-width="1"/>
  <path d="M 22 182 Q 100 168 178 182 L 178 192 Q 100 178 22 192 Z" fill="rgba(255,255,255,0.42)"/>
  <circle cx="100" cy="200" r="12" fill="rgba(124,58,237,0.85)"/>
  <circle cx="100" cy="200" r="10" fill="rgba(167,139,250,0.95)"/>
  <path d="M 102 192 L 96 202 L 100 202 L 98 208 L 104 198 L 100 198 Z" fill="#fff"/>
  <!-- Neck -->
  <rect x="82" y="150" width="36" height="24" rx="6" fill="#E8E1F8" stroke="rgba(124,58,237,0.2)" stroke-width="0.8"/>
  <line x1="82" y1="158" x2="118" y2="158" stroke="rgba(124,58,237,0.18)" stroke-width="0.5"/>
  <line x1="82" y1="165" x2="118" y2="165" stroke="rgba(124,58,237,0.18)" stroke-width="0.5"/>
  <!-- Head -->
  <path d="M 28 118 Q 18 90 22 60 Q 30 22 100 18 Q 170 22 178 60 Q 182 90 172 118 Q 168 158 100 162 Q 32 158 28 118 Z" fill="url(#head)" stroke="rgba(124,58,237,0.32)" stroke-width="1.2"/>
  <path d="M 40 50 Q 100 22 160 50 Q 160 35 100 30 Q 40 35 40 50 Z" fill="rgba(255,255,255,0.6)" opacity="0.65"/>
  <!-- Visor -->
  <rect x="32" y="74" width="136" height="50" rx="14" fill="url(#visor)" stroke="rgba(124,58,237,0.50)" stroke-width="1.2"/>
  <path d="M 36 80 Q 100 70 164 80 L 164 90 Q 100 78 36 90 Z" fill="rgba(255,255,255,0.12)"/>
  <!-- Eyes -->
  <ellipse cx="68"  cy="98" rx="14" ry="13" fill="url(#eye)" filter="url(#bloom)"/>
  <ellipse cx="68"  cy="95" rx="4"  ry="3"  fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="132" cy="98" rx="14" ry="13" fill="url(#eye)" filter="url(#bloom)"/>
  <ellipse cx="132" cy="95" rx="4"  ry="3"  fill="#FFFFFF" opacity="0.95"/>
  <!-- Smile -->
  <path d="M 88 116 Q 100 122 112 116" stroke="rgba(167,139,250,0.7)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Cheek blush -->
  <circle cx="48"  cy="110" r="4" fill="rgba(255,182,193,0.4)"/>
  <circle cx="152" cy="110" r="4" fill="rgba(255,182,193,0.4)"/>
  <!-- Antenna -->
  <rect x="95" y="-6" width="10" height="24" rx="5" fill="#D4CCEC" stroke="rgba(124,58,237,0.3)" stroke-width="0.5"/>
  <circle cx="100" cy="-9" r="9"  fill="rgba(124,58,237,0.25)"/>
  <circle cx="100" cy="-9" r="5"  fill="#7C3AED"/>
  <circle cx="100" cy="-9" r="2.5" fill="#A78BFA"/>
</svg>
